<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
  <!--
    Two-ring countdown indicator (matches Figma undo-button countdown-container)
    Outer track ring  neutral-150 (#d9d9d9)
    Inner progress arc  fresh primary (#2e7d52), ~3/4 full
    Circumference of r=8 H 50.3 px  |  3/4 arc H 37.7
  -->
  <circle cx="10" cy="10" r="8" stroke="#d9d9d9" stroke-width="2"/>
  <circle
    cx="10" cy="10" r="8"
    stroke="#2e7d52"
    stroke-width="2"
    stroke-linecap="round"
    stroke-dasharray="38 13"
    transform="rotate(-90 10 10)"
  />
</svg>
